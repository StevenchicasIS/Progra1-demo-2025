<form id=" frmAlumno">
    <div class="card border-secondary mb-3" style="min-width: 700px;">
        <div class="card-header">
            <div class="d-flex">
                Administracion de Alumnos

                <div class="ms-auto">
                    <button data-form="alumno" type="button" class="btn-close" aria-label="Close"></button>
                </div>
            </div>          
        </div>
        <div class="card-body text-secondary">
            <div class="row p-1">
                <div class="col-3 col-md-2">CODIGO</div>
                <div class="col-9 col-md-4">
                    <input required type="text" class="from-control" id="txtCodigoAlumno" name="CodigoAlumno" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">NOMBRE</div>
                <div class="col-9 col-md-8">
                    <input required type="text" class="from-control" id="txtNombreAlumno" name="NombreAlumno" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">DIRECCION</div>
                <div class="col-9 col-md-10">
                    <input required type="text" class="from-control" id="txtDreccionAlumno" name="DireccionAlumno" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">TELEFONO</div>
                <div class="col-9 col-md-4">
                    <input type="text" class="from-control" id="txtTelefonoAlumno" name="TelefonoAlumno" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-12 text-center">
                    <input type="submit" class="bnt btn-outline-primary" value="Guardar" />
                    <input type="reset" class="bnt btn-outline-warning" value="Nuevo" />
                    <input type="button" class="bnt btn-outline-success" value="Buscar" />
                </div>
            </div>
        </div>
    </div>
</form>
<script>
    frmAlumno.addEvenrListener("submit", e => {
        e.preventDefault();
        guardarAlumno();
    });
    async function guardarAlumno() {
        let datos = {
            codigo: txtCodigoAlumno.value,
            nombre: txtNombreAlumno.value,
            direccion: txtDireccionAlumno.value,
            telefono: txttelefonoAlumno.value,
        };
        url = 'https://localhost:7198/api/EXalumno',
            method = 'POST';
        const respuesta = await fetch(url, {
            method,
            headers: {
                "content-Type": "application/json"
            },
            body: JSON.stringify(datos)
        }), alumno = await respuesta.json();
        if (alumno?.idAlumno || 0) > 0) {
            limmpiarDatosAlumnos()
        }
    }
    function limpiarDatosAlumnos() {
        txtCodigoAlumno.value = "";
        txtNombreAlumno.value = "";
        txtDireccionAlumno.value = "";
        txttelefonoAlumno.value = "";

    }
</script>
